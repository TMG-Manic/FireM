<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Gateway Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="hidden">
        <div class="gateway-container">
            <header>
                <h1>Master Gateway</h1>
                <p>Select a destination instance</p>
            </header>
            
            <div class="server-list">
                <div class="server-card" data-bucket="1">
                    <h2>Roleplay Instance</h2>
                    <p>Strict RP rules apply. Inventory isolated.</p>
                    <button class="join-btn">Connect</button>
                </div>
                <div class="server-card" data-bucket="2">
                    <h2>Minigames Hub</h2>
                    <p>PVP, Racing, and Arcade. Inventory isolated.</p>
                    <button class="join-btn">Connect</button>
                </div>
            </div>
            
            <div class="footer">
                <p>Press ESC to close</p>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
